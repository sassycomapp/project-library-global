; Mybizz test suite: pytest settings for an Anvil app's tests.
; Copy to the app repository as tests/pytest.ini at Step 11.
[pytest]
testpaths = logic integration security
addopts = --import-mode=importlib -ra --strict-markers
markers =
    hosted: needs hosted App 1 (Users-service email, real webhooks, schedules, headers)
    local: needs the local runtime
    slow: volume and timing tests (IN-17)
